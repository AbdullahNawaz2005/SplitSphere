server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: splitsphere-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    # DB_URL must be a JDBC URL. For Neon, use:
    # jdbc:postgresql://<neon-host>:5432/<database>?sslmode=require&channelBinding=require
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  google:
    client-id: ${GOOGLE_CLIENT_ID}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
